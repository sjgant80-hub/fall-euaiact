name: gate
# v25 upgrade (2026-09): the risk classifier used to be inline page JS, so the old gate could only
# check the page. It is now a real extracted kernel (kernel.mjs) — so the gate PROVES it: tests, a
# mutation witness that must be CLEAN, and a page fixpoint (the live classifier IS the injected
# kernel). The page checks below still run — scripts parse, no placeholders, no dead links, no keys.
on: [push, pull_request, workflow_dispatch]
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tests
        run: node --test kernel.test.mjs
      - name: mutation gate — kernel.mjs must be CLEAN
        run: |
          node tools/witness.mjs mutate kernel.mjs --timeout 30000 --cap 600 --baseline witness.baseline.json --test node --test kernel.test.mjs | tee gate.out || true
          node -e "const b=require('fs').readFileSync('gate.out','utf8');const j=JSON.parse(b.slice(b.indexOf('{'),b.lastIndexOf('}')+1));if(j.clean!==true){console.error('GATE NOT CLEAN');process.exit(1)}console.log('CLEAN '+j.killed+'/'+j.total)"
      - name: page fixpoint — the live classifier IS the gated kernel
        run: |
          node make-page.mjs
          git diff --exit-code index.html
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: the page is actually a working page
        run: |
          node -e "
          const fs=require('fs'), path=require('path');
          const html=fs.readdirSync('.').filter(f=>f.endsWith('.html'));
          if(!html.length){ console.error('no HTML in this repo — nothing to serve'); process.exit(1); }
          let fail=0;
          for(const f of html){
            const s=fs.readFileSync(f,'utf8');
            const blocks=[...s.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)];
            blocks.forEach((m,i)=>{
              try { new (require('vm').Script)(m[1].replace(/^\s*import\s.*$/gm,'').replace(/^\s*export\s/gm,'')); }
              catch(e){ if(!/await is only valid|Unexpected token 'export'|Cannot use import/.test(e.message)){ console.error(f+' script['+i+'] DOES NOT PARSE: '+e.message); fail=1; } }
            });
            const ph=s.match(/__[A-Z][A-Z0-9_]*__/g);
            if(ph){ console.error(f+' serves unresolved placeholders: '+[...new Set(ph)].join(', ')); fail=1; }
            for(const m of s.matchAll(/(?:href|src)=\"(?!https?:|data:|mailto:|#|\/\/)([^\"?#]+)/g)){
              const t=m[1].replace(/^\.\//,'');
              if(t && !fs.existsSync(t)){ console.error(f+' links to a file that is not here: '+t); fail=1; }
            }
          }
          for(const f of fs.readdirSync('.')){
            if(!/\.(html|js|mjs|json|md)$/.test(f)) continue;
            const s=fs.readFileSync(f,'utf8');
            const hit=s.match(/(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)/);
            if(hit){ console.error(f+' contains what looks like a live credential: '+hit[1].slice(0,12)+'…'); fail=1; }
          }
          if(fail){ console.error('\nPAGE GATE FAILED'); process.exit(1); }
          console.log('page gate clean — '+html.length+' page(s): scripts parse, no placeholders, no dead same-repo links, no committed keys');
          "
